<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focused Study Player</title>
  <!-- GramJS Browser Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/telegram@2.26.22/browser/telegram.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
    header { background: var(--card); padding: 15px 25px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 1.2rem; color: var(--accent); }
    button { background: var(--accent); color: #0f172a; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-danger { background: #ef4444; color: white; padding: 6px 12px; font-size: 0.85rem; }
    .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; width: 100%; flex: 1; }
    
    /* Login Box */
    #login-box { max-width: 400px; margin: 60px auto; background: var(--card); padding: 25px; border-radius: 10px; }
    input { width: 100%; padding: 10px; margin: 10px 0 15px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; }
    
    /* Player & Playlist */
    #app-box { display: none; }
    .player-wrapper { background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 20px; position: relative; }
    video { width: 100%; max-height: 520px; display: block; }
    #status-bar { padding: 10px; background: var(--card); font-size: 0.9rem; color: var(--accent); }
    
    .video-list { display: grid; gap: 10px; }
    .video-item { background: var(--card); padding: 14px 18px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
    .video-item:hover { border-color: var(--accent); }
    .video-item.active { border-color: var(--accent); background: #1e3a5f; }
    .video-meta { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>

<header>
  <h1>📚 Focused Study Player</h1>
  <button id="logout-btn" class="btn-danger" style="display:none;" onclick="logout()">Logout</button>
</header>

<div class="container">
  <!-- Login Section -->
  <div id="login-box">
    <h2 style="margin-top:0;">Telegram Login</h2>
    <p style="font-size:0.85rem; color:var(--muted);">මෙය පළමු වතාවට පමණක් අවශ්‍ය වේ. ඔබගේ දත්ත මෙම browser එකේ පමණක් සුරැකේ.</p>
    <div id="step-phone">
      <label>Phone Number (with +94):</label>
      <input type="text" id="phone-input" placeholder="+94771234567" />
      <button onclick="sendCode()">Send OTP Code</button>
    </div>
    <div id="step-code" style="display:none;">
      <label>Telegram OTP Code:</label>
      <input type="text" id="code-input" placeholder="12345" />
      <label>2FA Password (තිබේ නම් පමණක්):</label>
      <input type="password" id="pass-input" placeholder="Optional" />
      <button onclick="verifyCode()">Verify & Open Channel</button>
    </div>
    <p id="login-status" style="color:#f87171; font-size:0.85rem;"></p>
  </div>

  <!-- Main Study Channel Player -->
  <div id="app-box">
    <div class="player-wrapper">
      <video id="video-player" controls playsinline></video>
      <div id="status-bar">පහත ලැයිස්තුවෙන් Video එකක් තෝරන්න...</div>
    </div>
    <h3 id="channel-title">Study Videos</h3>
    <div class="video-list" id="video-list"></div>
  </div>
</div>

<script>
  // ================= CONFIGURATION =================
  const API_ID = 31954047;[cite: 3]
  const API_HASH = "2a056e91cca05c632e33ebbd3265c16b";[cite: 3]
  const TARGET_CHANNEL_ID = "-1003949987871"; // ඔබේ නිවැරදි Study Channel ID එක
  // ===================================================

  const { TelegramClient, Api } = telegram;
  const { StringSession } = telegram.sessions;

  let client;
  let phoneCodeHash;
  let channelEntity;

  window.onload = async () => {
    const savedSession = localStorage.getItem("tg_study_session") || "";
    const session = new StringSession(savedSession);
    client = new TelegramClient(session, API_ID, API_HASH, { connectionRetries: 5 });

    if (savedSession) {
      document.getElementById("login-box").style.display = "none";
      document.getElementById("app-box").style.display = "block";
      document.getElementById("logout-btn").style.display = "block";
      document.getElementById("status-bar").innerText = "Telegram සමඟ සම්බන්ධ වෙමින් පවතී...";
      await client.connect();
      loadChannelVideos();
    }
  };

  async function sendCode() {
    const phone = document.getElementById("phone-input").value.trim();
    const status = document.getElementById("login-status");
    try {
      status.innerText = "OTP කේතය යවමින් පවතී...";
      await client.connect();
      const result = await client.sendCode({ apiId: API_ID, apiHash: API_HASH }, phone);
      phoneCodeHash = result.phoneCodeHash;
      document.getElementById("step-phone").style.display = "none";
      document.getElementById("step-code").style.display = "block";
      status.innerText = "";
    } catch (err) {
      status.innerText = "Error: " + err.message;
    }
  }

  async function verifyCode() {
    const phone = document.getElementById("phone-input").value.trim();
    const code = document.getElementById("code-input").value.trim();
    const password = document.getElementById("pass-input").value.trim();
    const status = document.getElementById("login-status");

    try {
      status.innerText = "පරීක්ෂා කරමින් පවතී...";
      await client.start({
        phoneNumber: async () => phone,
        phoneCode: async () => code,
        password: async () => password,
        onError: (err) => { throw err; },
      });
      localStorage.setItem("tg_study_session", client.session.save());
      location.reload();
    } catch (err) {
      status.innerText = "Login Error: " + err.message;
    }
  }

  async function loadChannelVideos() {
    const listEl = document.getElementById("video-list");
    const statusBar = document.getElementById("status-bar");

    try {
      channelEntity = await client.getEntity(TARGET_CHANNEL_ID);
      document.getElementById("channel-title").innerText = "📚 " + (channelEntity.title || "Study Videos");
      statusBar.innerText = "Videos ලැයිස්තුව ලබාගනිමින් පවතී...";

      const messages = await client.getMessages(channelEntity, { limit: 100 });
      listEl.innerHTML = "";
      let count = 0;

      messages.reverse().forEach((msg) => {
        if (msg.media && msg.media.document && msg.media.document.mimeType?.startsWith("video/")) {
          count++;
          const sizeMB = (Number(msg.media.document.size) / (1024 * 1024)).toFixed(1);
          const title = msg.message ? msg.message.split("\n")[0] : `Lesson Video #${count}`;

          const item = document.createElement("div");
          item.className = "video-item";
          item.innerHTML = `
            <div>
              <strong>${count}. ${title}</strong>
              <div class="video-meta">Size: ${sizeMB} MB</div>
            </div>
            <span>▶ Play</span>
          `;
          item.onclick = () => playVideo(msg, item, title);
          listEl.appendChild(item);
        }
      });

      statusBar.innerText = count > 0 
        ? `Videos ${count}ක් හමුවිය. බැලීමට video එකක් click කරන්න.` 
        : "මෙම channel එකේ videos හමු නොවීය.";
    } catch (err) {
      statusBar.innerText = "Channel Load Error: " + err.message;
    }
  }

  async function playVideo(msg, element, title) {
    document.querySelectorAll(".video-item").forEach(el => el.classList.remove("active"));
    element.classList.add("active");

    const player = document.getElementById("video-player");
    const statusBar = document.getElementById("status-bar");
    statusBar.innerText = `Loading: "${title}"... (කරුණාකර මදක් රැඳී සිටින්න)`;

    try {
      const buffer = await client.downloadMedia(msg, {
        progressCallback: (downloaded, total) => {
          const pct = ((Number(downloaded) / Number(total)) * 100).toFixed(0);
          statusBar.innerText = `Loading "${title}": ${pct}%`;
        }
      });
      const blob = new Blob([buffer], { type: msg.media.document.mimeType });
      player.src = URL.createObjectURL(blob);
      player.play();
      statusBar.innerText = `Now Playing: ${title}`;
    } catch (err) {
      statusBar.innerText = "Video Play Error: " + err.message;
    }
  }

  function logout() {
    localStorage.removeItem("tg_study_session");
    location.reload();
  }
</script>

</body>
</html>
